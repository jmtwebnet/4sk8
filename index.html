<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4SK8 • Prova Visual</title><style>
:root{--red:#a4262c;--paper:#f1f0e8;--ink:#101011}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px Arial,Helvetica,sans-serif;color:var(--ink)}a{color:inherit;text-decoration:none}.wrap{max-width:1220px;margin:auto;padding:0 26px}header{background:#f8f7f1;border-bottom:1px solid #ccc;position:sticky;top:0;z-index:10}.head{display:flex;align-items:center;gap:24px;min-height:77px;flex-wrap:wrap}.logo{font-size:35px;font-weight:950;letter-spacing:-3px}.logo b{color:var(--red)}nav{display:flex;gap:16px;flex:1;flex-wrap:wrap}nav a{font-size:12px;font-weight:800;text-transform:uppercase}nav a:hover,nav a.sel{color:var(--red)}.btn{display:inline-block;background:var(--red);color:white;padding:14px 18px;font-size:12px;text-transform:uppercase;font-weight:900;border:0}.intro{padding:65px 0 45px}.eyebrow{font-size:12px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:3px}h1{font-size:clamp(44px,6vw,84px);line-height:.94;text-transform:uppercase;margin:14px 0 24px;font-weight:950;letter-spacing:-3px}h1 em,h2 em{font-style:normal;color:var(--red)}h2{font-size:clamp(28px,3.8vw,46px);text-transform:uppercase;letter-spacing:-1.4px;margin:0 0 23px}.lead{max-width:610px;font-size:18px;line-height:1.55;color:#4d4d4a}.hero{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;background:#e6e4dc;min-height:440px}.hero .intro{padding:56px}.photo{background:#252525 center /cover no-repeat;min-height:320px;position:relative}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.48),transparent 65%);pointer-events:none}.photo small{position:absolute;bottom:18px;left:20px;color:white;z-index:1;font-weight:700;text-transform:uppercase}.section{padding:58px 0;border-top:1px solid #ccc}.bar{display:flex;justify-content:space-between;align-items:end;gap:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #d4d1c7;overflow:hidden}.card .photo{min-height:270px}.card-copy{padding:21px}.card h3{font-size:24px;margin:0 0 9px;text-transform:uppercase}.card p{color:#595959;line-height:1.5}.pill{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--red)}.newsgrid{display:grid;grid-template-columns:2fr 1fr;gap:20px}.listitem{border-bottom:1px solid #c5c3bc;padding:22px 0}.listitem h3{margin:7px 0;font-size:23px}.callout{background:#111;color:#fff;padding:45px}.callout h2{color:#fff}.athletes{padding-bottom:85px}footer{background:#111;color:#eee;padding:55px 0}footer .links{display:flex;flex-wrap:wrap;gap:16px;margin:22px 0;font-size:13px}footer p{color:#aaa}.note{background:#ffe8cf;border-left:5px solid var(--red);padding:15px 20px;font-size:13px;margin:15px 0 0}.hidden{display:none}.col2{display:grid;grid-template-columns:1fr 1fr;gap:30px}img{max-width:100%}@media(max-width:850px){.hero,.grid,.newsgrid,.col2{grid-template-columns:1fr}.head{padding-top:15px;padding-bottom:15px}.hero .intro{padding:35px 24px}nav{order:3;width:100%}.grid{gap:16px}}
</style></head><body>
<header><div class="wrap head"><a href="#inicio" class="logo"><b>4</b>SK8</a><nav id="nav"></nav><a href="#loja-virtual" class="btn">Criar Loja Virtual ↗</a></div></header>
<main id="page"></main>
<footer><div class="wrap"><div class="logo"><b>4</b>SK8</div><p>A cena cresce quando todo mundo se conecta. Skate, campeonatos, atletas, cultura e comunidade.</p><div class="links" id="footerlinks"></div><small>4SK8 · Prévia provisória de design — não é o site oficial.</small></div></footer>
<script>
const base='https://4sk8.com.br/';
const img=(s)=>"url('"+base+s+"')";
const data={
 inicio:{title:'A cena cresce quando todo mundo se conecta.',lead:'Campeonatos, notícias, skatistas, lojas e escolas. Tudo conectado pela cultura do skate.',image:'assets/hero-joao-baker-zine.webp'},
 campeonatos:{title:'Campeonatos de Skate',lead:'Circuitos, etapas e campeonatos que fazem a cena acontecer.',image:'assets/parnamirim-circuito-01.jpg'},
 'skate-shops':{title:'Skate Shops',lead:'Encontre lojas, pessoas e marcas que apoiam a cena local.',image:'assets/street-bionico.jpg'},
 escolas:{title:'Escolas de Skate',lead:'Espaços de aprendizagem, professores e projetos que levam o skate adiante.',image:'noticias/libre-skatepark-natal/inside.png'},
 organizar:{title:'Seu evento mais forte com a 4SK8',lead:'Divulgação, organização e conexão com a comunidade do skate.',image:'assets/event-skate-nu-quintal.jpg'},
 patrocinar:{title:'Patrocine a cena',lead:'Conecte sua marca aos atletas e aos campeonatos de skate.',image:'assets/parnamirim-circuito-02.jpg'},
 atletas:{title:'Atletas destacados',lead:'Três histórias e estilos que representam a força do skate brasileiro.',image:'assets/joao-world-rookie-acao.webp'},
 noticias:{title:'Notícias do Skate',lead:'Histórias reais da cena, competições e novos talentos.',image:'assets/tampa-am-2026-registro-1.webp'},
 'loja-virtual':{title:'Crie ou conecte sua Skate Shop',lead:'Dê visibilidade à sua loja e conecte seu negócio à cultura do skate.',image:'assets/street-bionico.jpg'},
 joao:{title:'João Henrique',lead:'Skate street · Natal, Rio Grande do Norte. Perfil com trajetória, galeria e press kit.',image:'assets/joao-profile.jpg'},
 lyliann:{title:'Lyliann Rodrigues',lead:'Skatista cearense em destaque. Perfil editorial em preparação.',image:'noticias/lyliann-rodrigues-campea-cearense-2026/assets/lyliann-comemoracao.webp'},
 thug:{title:'Wesley “Thug”',lead:'Skate Park · Bahia. Perfil editorial em preparação.',image:'noticias/wesley-thug-campeao-baiano-park-2026/assets/wesley-park.webp'}
};
const menu=[['Campeonatos','campeonatos'],['Skate Shops','skate-shops'],['Escolas','escolas'],['Organizar','organizar'],['Patrocinar','patrocinar'],['Atletas destacados','atletas'],['Notícias','noticias']];
const athletes=[['João Henrique','joao','assets/joao-profile.jpg','Street · Natal/RN'],['Lyliann Rodrigues','lyliann','noticias/lyliann-rodrigues-campea-cearense-2026/assets/lyliann-comemoracao.webp','Skate · Ceará'],['Wesley “Thug”','thug','noticias/wesley-thug-campeao-baiano-park-2026/assets/wesley-park.webp','Park · Bahia']];
function cards(items){return '<div class="grid">'+items.map(([name,slug,image,description])=>'<a class="card" href="#'+slug+'"><div class="photo" style="background-image:'+img(image)+'"><small>4SK8</small></div><div class="card-copy"><span class="pill">'+description+'</span><h3>'+name+'</h3><p>Conheça mais →</p></div></a>').join('')+'</div>'}
function athleteSection(){return '<section class="section athletes" id="atletas-destacados"><div class="wrap"><div class="bar"><h2>Atletas <em>destacados</em></h2><a class="pill" href="#atletas">Ver todos →</a></div>'+cards(athletes)+'</div></section>'}
function newsSection(){return '<section class="section"><div class="wrap"><div class="bar"><h2>Notícias <em>do skate</em></h2><a href="#noticias" class="pill">Ver todas →</a></div><div class="newsgrid"><a class="card" href="#noticias"><div class="photo" style="background-image:'+img('noticias/circuito-street-fortaleza-2026/cartaz-circuito-street.webp')+'"></div><div class="card-copy"><span class="pill">Campeonatos</span><h3>Circuito Street em Fortaleza</h3><p>O Best Trick e a cena local em destaque.</p></div></a><div><div class="listitem"><span class="pill">Atletas</span><h3>Lyliann Rodrigues é campeã cearense</h3></div><div class="listitem"><span class="pill">Park</span><h3>Wesley “Thug” vence campeonato baiano</h3></div><div class="listitem"><span class="pill">Street</span><h3>João Henrique no World Rookie Finals</h3></div></div></div></div></section>'}
function defaultContent(id){let blocks={
campeonatos:[['Circuito Nordestino de Miniramp','campeonatos','assets/circuito-nordestino-legends.jpg','Circuito'],['Skate Nu Quintal','campeonatos','assets/event-skate-nu-quintal.jpg','Evento'],['Circuito Street','campeonatos','noticias/circuito-street-fortaleza-2026/cartaz-circuito-street.webp','Fortaleza']],
escolas:[['Escolas e projetos','escolas','noticias/libre-skatepark-natal/inside.png','Aprendizagem'],['Skate para iniciantes','escolas','assets/skate-nu-quintal-acao.jpg','Aulas'],['Comunidade local','escolas','assets/parnamirim-circuito-01.jpg','Conexão']],
organizar:[['Planejamento','organizar','assets/event-jam-paraiba.jpg','01'],['Divulgação','organizar','assets/event-skate-nu-quintal.jpg','02'],['Cobertura','organizar','assets/parnamirim-circuito-01.jpg','03']],
patrocinar:[['Atletas','atletas','assets/joao-profile.jpg','Talentos'],['Campeonatos','campeonatos','assets/parnamirim-circuito-02.jpg','Eventos'],['Projetos','escolas','assets/skate-nu-quintal-acao.jpg','Comunidade']]};
let items=blocks[id]||[['Campeonatos','campeonatos','assets/parnamirim-circuito-01.jpg','Agenda'],['Notícias','noticias','assets/tampa-am-2026-registro-1.webp','Editorial'],['Atletas','atletas','assets/joao-profile.jpg','Perfis']];
return '<section class="section"><div class="wrap"><h2>Explore a <em>cena</em></h2>'+cards(items)+'</div></section>'}
function render(){let id=decodeURIComponent(location.hash.slice(1))||'inicio';if(!data[id])id='inicio';let d=data[id];document.querySelector('#nav').innerHTML=menu.map(([text,slug])=>'<a class="'+(slug===id?'sel':'')+'" href="#'+slug+'">'+text+'</a>').join('');document.querySelector('#footerlinks').innerHTML=menu.map(([text,slug])=>'<a href="#'+slug+'">'+text+'</a>').join('');let main='<div class="wrap" style="padding-top:16px"><div class="note">PRÉVIA VISUAL PROVISÓRIA • Estrutura de apresentação. Fotografias carregadas do endereço público 4sk8.com.br, quando disponíveis; não é uma cópia fiel de todas as páginas originais.</div></div><section class="wrap" style="padding-top:22px"><div class="hero"><div class="intro"><div class="eyebrow">4SK8 · skate brasileiro</div><h1>'+d.title.replace(' destacados',' <em>destacados</em>').replace(' de Skate',' <em>de Skate</em>')+'</h1><p class="lead">'+d.lead+'</p><a href="#'+(id==='inicio'?'campeonatos':'atletas')+'" class="btn">Explorar 4SK8 →</a></div><div class="photo" style="background-image:'+img(d.image)+'"><small>Fotografia da cena do skate</small></div></div></section>';
if(id==='inicio'){main+=newsSection();main+=defaultContent('campeonatos');main+='<section class="section"><div class="wrap"><div class="callout"><h2>Skate, cultura e <em>conexões</em></h2><p>Campeonatos · Skate Shops · Escolas · Patrocínio</p></div></div></section>';main+=athleteSection();}
else if(id==='atletas')main+='<section class="section"><div class="wrap"><h2>Conheça nossos <em>atletas</em></h2>'+cards(athletes)+'</div></section>';
else if(['joao','lyliann','thug'].includes(id)){main+='<section class="section"><div class="wrap"><h2>Trajetória e <em>notícias</em></h2><p class="lead">Página de perfil em versão de prova. Os conteúdos existentes serão preservados na implementação final.</p>'+cards(athletes)+'</div></section>';}
else if(id==='noticias')main+=newsSection()+defaultContent(id);
else main+=defaultContent(id)+athleteSection();
document.querySelector('#page').innerHTML=main;window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script></body></html>
