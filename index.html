if(id==='inicio'){content+=archiveSection(9)+champs()+block('EXPLORE <span class="red">A CENA</span>',[['ESCOLAS DE SKATE','escolas','school','APRENDER'],['ORGANIZE SEU EVENTO','organizar','event2','COMPETIR'],['PATROCINE O SKATE','patrocinar','comp2','APOIAR']]);content+='<section class="section"><div class="wrap"><div class="poster"><h2>FAÇA PARTE <br>DO <span style="color:#101010">MOVIMENTO.</span></h2><p>Skate nas ruas, nas pistas e em todos os lugares.</p></div></div></section>'+ath();}

else if(id==='lyliann')content+='<section class="section"><div class="wrap split"><div><span class="label">ATLETA 4SK8 / CEARÁ</span><h2>NO SKATE. <span class="red">NA LUTA.</span></h2><p>Lyliann Rodrigues é atleta do Ceará e foi destaque do campeonato cearense de 2026. Este perfil reúne fotografias reais e notícias já publicadas sobre sua participação na cena.</p><p>Esta é uma proposta editorial: não atribuímos frases, resultados adicionais ou patrocinadores sem confirmação.</p><a class="btn" href="https://4sk8.com.br/noticias/lyliann-rodrigues-campea-cearense-2026/" target="_blank" rel="noopener">VER NOTÍCIA ORIGINAL ↗</a></div><div class="bigphoto" style="background-image:url(\''+B+P.lyliann2+'\')"></div></div></section>'+block('GALERIA <span class="red">REAL</span>',[['COMEMORAÇÃO','lyliann','lyliann','CEARÁ'],['PÓDIO CEARENSE','lyliann','lyliann2','COMPETIÇÃO'],['NOTÍCIA 4SK8','noticias','lyliann','ARQUIVO']]);
else if(id==='joao'||id==='thug')content+=block('FOTOS <span class="red">REAIS</span>',[[id==='joao'?'JOÃO NA PISTA':'WESLEY NO PARK',id,id==='joao'?'joao2':'thug','ATLETA'],['RETRATO',id,id==='joao'?'joao':'thug2','PERFIL'],['CONHEÇA A CENA','atletas','comp','4SK8']]);
